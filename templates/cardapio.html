{% extends "layout.html" %}{% block content %}<div class="top"><div><h1>Cardápio</h1><div class="muted">Cadastre as refeições servidas por data.</div></div></div><div class="card"><form method="post" class="form"><input type="date" name="data" required><select name="refeicao"><option>Almoço</option><option>Lanche</option><option>Café da manhã</option></select><input name="nome" placeholder="Ex.: Arroz, feijão, carne, salada e fruta" required><button class="btn">+ Adicionar</button></form><table class="table"><tr><th>Data</th><th>Refeição</th><th>Cardápio</th></tr>{% for r in rows %}<tr><td>{{r.data}}</td><td>{{r.refeicao}}</td><td>{{r.nome}}</td></tr>{% endfor %}</table></div>{% endblock %}
